name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate repository contract
        run: python scripts/validate_repo.py .
      - name: Compile Python
        run: python -m compileall -q backend cartography scripts tests

  build:
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      matrix:
        service: [frontend, backend, cartography]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build -f ${{ matrix.service }}/Dockerfile -t visor-${{ matrix.service }}:ci .
