name: CI
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_repo.py .
      - run: python -m compileall -q backend cartography scripts tests
      - run: python -m pip install -r backend/requirements.txt
      - name: Backend regression tests
        env:
          PYTHONPATH: backend
          OLLAMA_URL: http://127.0.0.1:9/api/generate
          OLLAMA_TIMEOUT: '1'
        run: python -m unittest discover -s tests/backend -p 'test_*.py'
  build:
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      matrix:
        service: [frontend, backend, cartography]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f ${{ matrix.service }}/Dockerfile -t visor-${{ matrix.service }}:ci .
