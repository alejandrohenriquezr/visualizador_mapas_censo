name: CI
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate repository contract
        run: python scripts/validate_repo.py .
      - name: Compile Python
        run: python -m compileall -q backend cartography scripts tests
      - name: Validate shell scripts use LF
        run: |
          python - <<'PY'
          from pathlib import Path
          bad = []
          for p in Path('.').rglob('*.sh'):
              if b'\r\n' in p.read_bytes():
                  bad.append(str(p))
          if bad:
              raise SystemExit('CRLF no permitido en scripts sh: ' + ', '.join(bad))
          PY
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Release regression suite
        working-directory: tests/backend
        env:
          PYTHONPATH: ../../backend
          OLLAMA_URL: http://127.0.0.1:9/api/generate
          OLLAMA_TIMEOUT: '1'
        run: >
          python -m unittest
          test_indicadores_v24
          test_v26_regresiones
          test_presentacion_exportacion
          test_migracion_interna
          test_movilidad_laboral
          test_v27_indicadores_censales
          test_v28_consultas_compuestas
          test_v29_denominadores
          test_v30_regresiones

  build:
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      matrix:
        service: [frontend, backend, cartography]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build -f ${{ matrix.service }}/Dockerfile -t visor-${{ matrix.service }}:ci .
      - name: Validate cartography gzip cache
        if: matrix.service == 'cartography'
        run: >
          docker run --rm visor-cartography:ci
          python -c "import gzip,main;
          main.serializar=lambda *a,**k:(b'{\"type\":\"FeatureCollection\",\"features\":[]}'*1000,'vtest');
          raw,z,v=main.serializar_gzip('region');
          assert gzip.decompress(z)==raw;
          assert len(z)<len(raw);
          print('cartography gzip OK',len(raw),len(z))"
