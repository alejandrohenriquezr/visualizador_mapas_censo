name: visor-censo

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: visor-censo-frontend:${APP_VERSION:-latest}
    ports:
      - "${VISOR_PORT:-8010}:80"
    depends_on:
      backend:
        condition: service_healthy
      cartography:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks: [visor_net]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: visor-censo-backend:${APP_VERSION:-latest}
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-visor}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-visor_censo}
      OLLAMA_URL: http://llm:11434/api/generate
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b-instruct}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-45}
      OLLAMA_REINTENTO_SEG: ${OLLAMA_REINTENTO_SEG:-60}
      CARTOGRAPHY_URL: http://cartography:8090
      CENSO_DATOS_DIR: /app/datos
      CENSO_PLANTILLA_EXCEL: /app/resources/plantilla_de_salida.xlsx
      CENSO_PRECALENTAR_GEOMETRIAS: "0"
      PENDING_TTL_MINUTES: ${PENDING_TTL_MINUTES:-30}
    volumes:
      - ${CENSO_DATOS_HOST:-./datos}:/app/datos:ro
    depends_on:
      db:
        condition: service_healthy
      cartography:
        condition: service_healthy
      llm:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/salud',timeout=4).read()"]
      interval: 20s
      timeout: 6s
      start_period: 20s
      retries: 8
    networks: [visor_net]

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-visor_censo}
      POSTGRES_USER: ${POSTGRES_USER:-visor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-visor} -d ${POSTGRES_DB:-visor_censo}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [visor_net]

  llm:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 10
    networks: [visor_net]

  cartography:
    build:
      context: .
      dockerfile: cartography/Dockerfile
    image: visor-censo-cartography:${APP_VERSION:-latest}
    env_file: [.env]
    environment:
      CENSO_CARTOGRAFIA_GDB: ${CENSO_CARTOGRAFIA_GDB}
      CENSO_CACHE_DIR: /app/runtime/cache
      CENSO_PRECALENTAR_GEOMETRIAS: ${CENSO_PRECALENTAR_GEOMETRIAS:-region,comuna,provincia}
      CENSO_SIMPLIFICACION: ${CENSO_SIMPLIFICACION:-0.0005}
    volumes:
      - ${CENSO_CARTOGRAFIA_HOST:-./cartografia}:/app/cartografia:ro
      - cartography_cache:/app/runtime/cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8090/api/salud',timeout=4)); raise SystemExit(0 if d.get('gdb_existe') else 1)"]
      interval: 20s
      timeout: 6s
      start_period: 20s
      retries: 10
    networks: [visor_net]

networks:
  visor_net:
    driver: bridge

volumes:
  postgres_data:
    name: visor_censo_postgres
  ollama_models:
    name: visor_censo_ollama
  cartography_cache:
    name: visor_censo_cartography_cache
